<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Periódica Interactiva</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
</head>
<body>
    <!-- Pantalla principal: Tabla completa -->
    <div id="pantalla-tabla" class="pantalla-activa">
        <h1 class="titulo-principal">Tabla Periodica Interactiva</h1>
        <div id="contenedor-grid"></div>
    </div>

    <!-- Pantalla Visor 3D -->
    <div id="canvas-container">

    <div class="camara-preview">
        <video id="video-camara" autoplay playsinline muted style="display:none;"></video>
        <canvas id="canvas-mediapipe"></canvas>
    </div>
        <!-- Aquí Three.js inyectará el <canvas> -->
    </div>

    <!-- Panel de Datos -->
    <aside id="panel-datos">
        <div class="tarjeta-cristal">
            <header>
                <span id="ui-numero-atomico">79</span>
                <h1 id="ui-simbolo">Au</h1>
            </header>
            
            <section class="detalles">
                <h2 id="ui-nombre">Oro</h2>
                
                <div class="grid-specs">
                    <div class="spec">
                        <label>Familia</label>
                        <span id="ui-familia">Gas noble</span>
                    </div>
                    <div class="spec">
                        <label>Ubicación</label>
                        <span>Grupo <span id="ui-grupo">18</span>, Per. <span id="ui-periodo">1</span></span>
                    </div>
                    <div class="spec">
                        <label>Masa Atómica</label>
                        <span id="ui-masa">1.008</span>
                    </div>
                    <div class="spec">
                        <label>Estado</label>
                        <span id="ui-estado">Gas</span>
                    </div>
                    <div class="spec">
                        <label>Configuración</label>
                        <span id="ui-config">1s¹</span>
                    </div>
                    <div class="spec">
                        <label>Electronegatividad</label>
                        <span id="ui-electro">2.2</span>
                    </div>
                </div>
                
                <p id="ui-descripcion">Metal de transición denso, brillante y extremadamente maleable...</p>
            </section>
        </div>
        
        <!-- Controles temporales para probar la lógica antes de conectar MediaPipe -->
        <div class="controles-temporales">
            <button id="btn-prev">◀ Anterior</button>
            <button id="btn-next">Siguiente ▶</button>
        </div>
    </aside>

    <script src="src/js/app.js" type="module"></script>
</body>
</html>
